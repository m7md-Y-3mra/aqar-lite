services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: aqar
      POSTGRES_PASSWORD: aqar
      POSTGRES_DB: aqar
    volumes:
      - db-data:/var/lib/postgresql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqar -d aqar"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Local development values, not production secrets.
      DATABASE_URL: postgresql://aqar:aqar@db:5432/aqar
      APP_ORIGIN: http://localhost:3000
      LOG_LEVEL: info
    ports:
      - "3000:3000"
volumes:
  db-data:
